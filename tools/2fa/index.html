  <script id="site-theme-init">/* Runs before styles/paint, including on the isolated 2FA page. */
(function () {
  'use strict';
  const key = 'soyo-theme';
  const root = document.documentElement;
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const valid = value => ['light', 'dark', 'system'].includes(value) ? value : 'system';
  let preference = 'system';
  try { preference = valid(localStorage.getItem(key)); } catch {}
  function apply() {
    root.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    root.style.colorScheme = root.dataset.theme;
    document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
      meta.removeAttribute('media');
      meta.content = root.dataset.theme === 'dark' ? '#101c16' : '#edf4ed';
    });
    document.querySelectorAll('[data-theme-select]').forEach(select => { select.value = preference; });
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key === key || event.key === null) { preference = valid(event.newValue); apply(); }
  });
  document.addEventListener('DOMContentLoaded', () => {
    apply();
    document.querySelectorAll('[data-theme-select]').forEach(select => {
      select.addEventListener('change', () => {
        preference = valid(select.value);
        try { localStorage.setItem(key, preference); } catch {}
        apply();
      });
    });
  });

  <style id="twofa-style">:root {
  color-scheme:light dark;
  --surface:#edf4ed;
  --container:#fff;
  --low:#edf4ed;
  --primary:#286a50;
  --on-primary:#fff;
  --tonal:#ccebd9;
  --on-tonal:#0a3828;
  --text:#19221c;
  --muted:#526259;
  --outline:#a4b4a8;
  --error:#ba1a1a;
  --ease:cubic-bezier(.2,0,0,1)
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--surface);
  min-height:100vh
}
a {
  color:inherit;
  text-decoration:none
}
button,input {
  font:inherit
}
button,a,input,summary {
  -webkit-tap-highlight-color:transparent
}
button {
  cursor:pointer;
  border:0;
  min-height:48px;
  padding:0 24px;
  border-radius:999px;
  font-weight:600;
  transition:background-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)
}
button:active {
  transform:scale(.97)
}
button:disabled {
  opacity:.45;
  cursor:default
}
button:focus-visible,a:focus-visible,summary:focus-visible {
  outline:3px solid var(--primary);
  outline-offset:4px
}
.shell {
  display:grid;
  grid-template-columns:220px minmax(0,780px);
  gap:64px;
  max-width:1200px;
  margin:auto;
  padding:56px 32px
}
.rail {
  align-self:start;
  position:sticky;
  top:48px;
  padding:12px 0
}
.brand {
  font-weight:750;
  font-size:25px;
  letter-spacing:-.8px
}
.rail-caption {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:4px 0 32px
}
.rail nav {
  display:grid;
  gap:8px
}
.rail nav a {
  padding:12px 24px;
  border-radius:999px;
  transition:background-color .2s var(--ease);
  font-size:14px
}
.rail nav a:hover {
  background:var(--low)
}
.rail nav a[aria-current] {
  background:var(--tonal);
  color:var(--on-tonal);
  font-weight:700
}
.rail-note {
  margin-top:40px;
  color:var(--muted);
  font-size:12px;
  padding-left:24px
}
main {
  min-width:0
}
.intro {
  margin:0 8px 28px
}
.eyebrow {
  font-size:11px;
  letter-spacing:2.5px;
  font-weight:700;
  color:var(--primary)
}
h1 {
  font-size:clamp(30px,4vw,46px);
  letter-spacing:-1.5px;
  line-height:1.2;
  margin:12px 0
}
.heading-dot {
  color:var(--primary)
}
.intro p {
  margin:0;
  color:var(--muted)
}
.auth-card {
  background:var(--container);
  padding:32px;
  border-radius:32px;
  box-shadow:0 8px 32px #1634250a
}
.card-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px
}
.symbol {
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  background:var(--tonal);
  border-radius:18px;
  color:var(--on-tonal);
  font-size:32px
}
.privacy-chip {
  font-size:12px;
  color:var(--primary);
  border:1px solid var(--outline);
  padding:6px 12px;
  border-radius:8px
}
label {
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:8px
}
.input-wrap {
  display:flex;
  align-items:center;
  border:1px solid var(--outline);
  border-radius:12px;
  transition:box-shadow .2s var(--ease)
}
.input-wrap:focus-within {
  box-shadow:0 0 0 2px var(--primary);
  border-color:transparent
}
input {
  width:100%;
  min-width:0;
  background:transparent;
  border:0;
  color:var(--text);
  padding:18px 16px;
  outline:0
}
input::placeholder {
  color:var(--muted);
  font-size:14px
}
.input-wrap button {
  flex-shrink:0;
  padding:0 16px;
  margin-right:4px
}
.text-button {
  background:transparent;
  color:var(--primary)
}
.text-button:hover {
  background:var(--low)
}
.support {
  font-size:12px;
  color:var(--muted);
  margin:8px 4px 0
}
.error {
  color:var(--error);
  font-size:13px;
  min-height:21px;
  margin:4px
}
.form-actions {
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:8px
}
.filled {
  color:var(--on-primary);
  background:var(--primary)
}
.filled span {
  margin-left:20px
}
.filled:hover {
  box-shadow:0 4px 12px #16342524
}
.tonal {
  background:var(--tonal);
  color:var(--on-tonal);
  font-size:13px
}
.tonal:hover:not(:disabled) {
  box-shadow:0 2px 8px #1634251a
}
.result {
  margin-top:28px;
  background:var(--low);
  border-radius:24px;
  padding:24px;
  min-height:226px
}
.result-label {
  color:var(--muted);
  font-size:12px;
  display:block;
  overflow-wrap:anywhere
}
#code {
  display:block;
  font-family:ui-monospace,Consolas,monospace;
  font-size:clamp(34px,6vw,58px);
  font-weight:650;
  letter-spacing:3px;
  color:var(--primary);
  line-height:1.4;
  margin:8px 0 14px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums
}
.result-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
#countdown {
  color:var(--muted);
  font-size:12px;
  font-variant-numeric:tabular-nums
}
.track {
  height:4px;
  border-radius:10px;
  background:var(--outline);
  overflow:hidden;
  margin-top:18px
}
#progress {
  height:100%;
  background:var(--primary);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .25s linear
}
.parameters {
  font-size:11px;
  color:var(--muted);
  margin:10px 0 0
}
.privacy-note {
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  margin:20px 4px 0
}
.help {
  margin:20px 8px;
  color:var(--muted);
  font-size:13px
}
.help summary {
  cursor:pointer;
  padding:10px 0
}
.help p {
  max-width:65ch
}
.signature {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:16px 0
}
.signature strong {
  letter-spacing:2px;
  color:var(--primary);
  margin-left:3px
}
.signature span {
  display:block;
  font-size:11px;
  margin-top:5px
}
#snackbar {
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translate(-50%,16px);
  opacity:0;
  pointer-events:none;
  max-width:calc(100% - 32px);
  width:max-content;
  border-radius:12px;
  padding:12px 24px;
  color:var(--surface);
  background:var(--text);
  font-size:14px;
  transition:opacity .2s var(--ease),transform .2s var(--ease)
}
#snackbar.visible {
  opacity:1;
  transform:translate(-50%,0)
}
html[data-theme='dark'] {
    --surface:#101c16;
    --container:#19251e;
    --low:#22332a;
    --primary:#9cd5b5;
    --on-primary:#003823;
    --tonal:#304f3e;
    --on-tonal:#c2efd4;
    --text:#e0e9e0;
    --muted:#b0c1b4;
    --outline:#53695b;
    --error:#ffb4ab
  }
@media(max-width:800px) {
  .shell {
    display:block;
    padding:20px;
    max-width:680px
  }
  .rail {
    position:static;
    padding:0;
    margin-bottom:32px
  }
  .brand {
    font-size:21px
  }
  .rail-caption,.rail-note {
    display:none
  }
  .rail nav {
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    padding:12px 0 6px
  }
  .rail nav a {
    white-space:nowrap;
    padding:10px 16px
  }
  .intro {
    margin:0 4px 24px
  }
  .auth-card {
    padding:24px;
    border-radius:28px
  }
  body {
    background-attachment:scroll
  }
}
@media(max-width:420px) {
  .shell {
    padding:16px
  }
  .auth-card {
    padding:20px
  }
  .result {
    padding:18px
  }
  .result-bottom {
    gap:8px
  }
  .tonal {
    padding:0 14px
  }
  #code {
    letter-spacing:1px
  }
  .privacy-chip {
    font-size:11px
  }
  .intro p {
    font-size:14px
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important
  }
  button:active {
    transform:none
  }
}

.theme-control { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:13px; padding:12px; }
.theme-control select { font:inherit; color:var(--text); background:var(--low); border:1px solid var(--outline); border-radius:12px; padding:10px; min-height:44px; }
</style>

  const form = document.getElementById('toolbox-unlock');
  const input = document.getElementById('toolbox-password');
  const button = form.querySelector('button');
  const error = document.getElementById('toolbox-error');
  const bytes = text => Uint8Array.from(atob(text), char => char.charCodeAt(0));
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    error.textContent = '';
    if (!window.crypto || !window.crypto.subtle) {
      error.textContent = '请使用 HTTPS 安全连接打开此页面。';
      return;
    }
    button.disabled = true;
    button.textContent = '正在解锁…';
    try {
      const payload = JSON.parse(document.getElementById('toolbox-payload').textContent);
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256'}, material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(payload.iv)}, key, bytes(payload.data));
      input.value = '';
      document.open();
      document.write(new TextDecoder().decode(plain));
      document.close();
    } catch (_) {
      error.textContent = '密码不正确，或页面数据已损坏，请重试。';
      input.value = '';
      input.focus();
      button.disabled = false;
      button.textContent = '解锁工具箱';
    }
  });
})();</script></body></html>

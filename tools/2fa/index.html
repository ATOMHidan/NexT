  <script id="site-theme-init">/* Runs before styles/paint, including on the isolated 2FA page. */

  'use strict';
  const key = 'soyo-theme';
  const root = document.documentElement;
  const homeDefaults = {welcome:'full', density:'comfortable', profile:'show', music:'show', mainOrder:'welcome', sideOrder:'profile'};
  const homeChoices = {welcome:['full','brief'],density:['comfortable','compact'],profile:['show','hide'],music:['show','hide'],mainOrder:['welcome','posts'],sideOrder:['profile','music']};
  let home = {...homeDefaults};
  function setHome(value, save) {
    for (const name of Object.keys(homeDefaults)) {
      home[name] = homeChoices[name].includes(value?.[name]) ? value[name] : homeDefaults[name];
      root.setAttribute('data-home-' + name.toLowerCase(),home[name]);
    }
    if(save) { try { localStorage.setItem('soyo-home-layout',JSON.stringify(home)); } catch {} }
    if(home.music==='hide' && document.querySelector('.main-inner.index')) document.querySelector('.local-music-audio')?.pause();
    document.dispatchEvent(new CustomEvent('home-layout-change'));
  }
  try { setHome(JSON.parse(localStorage.getItem('soyo-home-layout')),false); } catch { setHome(null,false); }
  window.SoyoHomeLayout={get:()=>({...home}),set:value=>setHome(value,true),reset:()=>setHome(null,true)};
  window.addEventListener('storage',event=>{if(event.key==='soyo-home-layout'||event.key===null){try{setHome(JSON.parse(event.newValue),false);}catch{setHome(null,false);}}});

  const valid = value => ['light', 'dark', 'system'].includes(value) ? value : 'system';
  let preference = 'system';
  const paletteKey = 'soyo-palette';
  const validPalette = value => ['green', 'blue', 'purple', 'apricot'].includes(value) ? value : 'green';
  let palette = 'green';
  try { preference = valid(localStorage.getItem(key)); } catch {}
  try { palette = validPalette(localStorage.getItem(paletteKey)); } catch {}
  function apply() {
    root.dataset.palette = palette;
    root.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    root.style.colorScheme = root.dataset.theme;
    document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
      meta.removeAttribute('media');
      meta.content = palette === 'green' ? (root.dataset.theme === 'dark' ? '#101c16' : '#edf4ed') : (root.dataset.theme === 'dark' ? '#191b1e' : '#f3f4f6');
    });
    document.querySelectorAll('[data-theme-select]').forEach(select => { select.value = preference; });

  function revealPalette(button) {
    paletteTransition?.skipTransition();
    if (!document.startViewTransition || !root.animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(); return; }

    const x = box.left + box.width / 2, y = box.top + box.height / 2;
    const radius = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y));

    catch { root.classList.remove('palette-reveal'); apply(); return; }

      if (paletteTransition !== transition) return;
      transition.skipTransition(); apply();
      root.classList.remove('palette-reveal'); paletteTransition = null;
    }, 1000);
    transition.ready.then(() => {
      if (paletteTransition !== transition) return;
      return root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`]}, {
        duration: innerWidth < 600 ? 260 : 380, easing:'cubic-bezier(.2,0,0,1)', pseudoElement:'::view-transition-new(root)'

      clearTimeout(watchdog);

    if (event.key === key || event.key === null) { preference = valid(event.newValue); apply(); }

    apply();

      });

  <style id="twofa-style">:root {

* {

body {

}

}

  const form = document.getElementById('toolbox-unlock');
  const input = document.getElementById('toolbox-password');
  const button = form.querySelector('button');
  const error = document.getElementById('toolbox-error');
  const bytes = text => Uint8Array.from(atob(text), char => char.charCodeAt(0));
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    error.textContent = '';
    if (!window.crypto || !window.crypto.subtle) {
      error.textContent = '请使用 HTTPS 安全连接打开此页面。';
      return;
    }
    button.disabled = true;
    button.textContent = '正在解锁…';
    try {
      const payload = JSON.parse(document.getElementById('toolbox-payload').textContent);
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256'}, material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(payload.iv)}, key, bytes(payload.data));
      input.value = '';
      document.open();
      document.write(new TextDecoder().decode(plain));
      document.close();
    } catch (_) {
      error.textContent = '密码不正确，或页面数据已损坏，请重试。';
      input.value = '';
      input.focus();
      button.disabled = false;
      button.textContent = '解锁工具箱';
    }
  });
})();</script></body></html>
